[project]
name = "ai-sales-coach-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "phonenumbers>=9,<10",
  "twilio>=9.8,<10",
  "websockets>=15,<16",
  "langgraph>=0.6,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:The default value of `allowed_objects` will change.*",
]
